[package]
name = "matching-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
# Performance & Data Structures
fxhash = "0.2.1"        
smallvec = { version = "1", features = ["union"] }
parking_lot = "0.12"    

# Async & Event Driven
tokio = { version = "1.35", features = ["full"] }
tonic = "0.11"                                   
prost = "0.12"                                   
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

rdkafka = { version = "0.36", features = ["tokio", "cmake-build"] }

# Error Handling
thiserror = "1.0"
anyhow = "1.0"
bincode = "1.3.3"
tempfile = "3.27.0"


[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort" 

[dev-dependencies]
proptest = "1.4"

[build-dependencies]
tonic-build = "0.11"                             
syntax = "proto3";

package diocoin.exchange.matching;

// 🚀 DATA PLANE: High-speed trading order service via gRPC (HTTP/2 Multiplexing)
service OrderExecutionService {
    // Submit trading orders to the engine (already authenticated by upstream)
    rpc SubmitOrder (SubmitOrderRequest) returns (SubmitOrderResponse);
    
    // Cancel trading orders from the Order Book
    rpc CancelOrder (CancelOrderRequest) returns (CancelOrderResponse);
}

enum Side {
    SIDE_UNSPECIFIED = 0;
    SIDE_BUY = 1;
    SIDE_SELL = 2;
}

enum OrderType {
    ORDER_TYPE_UNSPECIFIED = 0;
    ORDER_TYPE_LIMIT = 1;
    ORDER_TYPE_MARKET = 2;
}

message SubmitOrderRequest {
    uint64 order_id = 1;
    uint64 user_id = 2;
    string symbol = 3;         // Trading pair, e.g., "BTC-USDT"
    Side side = 4;
    OrderType order_type = 5;
    uint64 price = 6;          // Fixed-point integer (Scale: 10^8)
    uint64 quantity = 7;
}

message SubmitOrderResponse {
    bool success = 1;
    string message = 2;
}

message CancelOrderRequest {
    uint64 order_id = 1;
    string symbol = 2;
}

message CancelOrderResponse {
    bool success = 1;
    string message = 2;
}

// =================================================================
// Consolidated from EVENTS.PROTO so Rust generates everything into the same module.
// =================================================================

message TradeExecutedEvent {
  uint64 maker_id = 1;
  uint64 taker_id = 2;
  uint64 price = 3;         // Scale: 10^8
  uint64 match_qty = 4;      // Scale: 10^8
  uint64 total_value = 5;    // Scale: 10^8
  int64 timestamp = 6;
}

message OutboundEvent {
  oneof event {
    TradeExecutedEvent trade = 1;
  }
}
